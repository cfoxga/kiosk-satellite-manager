provision:
  name: Provision
  description: >-
    Apply a settings payload to a Kiosk Satellite device over its
    ks.provision ADB intent, then verify the change against /api/health.
    Fails loudly if the read-back doesn't confirm the change landed.
  fields:
    config_entry_id:
      name: Device
      description: The Kiosk Satellite Manager config entry to provision.
      required: true
      selector:
        config_entry:
          integration: kiosk_satellite_manager
    settings:
      name: Settings
      description: >-
        Supported typed keys: device.name (text), device.hostname (text),
        remote.enabled (boolean), remote.password (text), and
        esphome.node_name (text). Other keys are rejected.
      required: true
      example: {"device.name": "Kitchen Portal"}
      selector:
        object:
capability_report:
  name: Capability report
  description: >-
    Return a versioned, sanitized, read-only Android capability report. Raw shell
    output, account identifiers, credentials, and ADB keys are never returned.
  fields:
    config_entry_id:
      name: Device
      description: The Kiosk Satellite Manager config entry to inspect.
      required: true
      selector:
        config_entry:
          integration: kiosk_satellite_manager
onboarding_plan:
  name: Onboarding plan
  description: >-
    Return a deterministic, read-only onboarding plan from sanitized Android
    capability evidence. This service never executes plan actions.
  fields:
    config_entry_id:
      name: Device
      description: The Kiosk Satellite Manager config entry to inspect.
      required: true
      selector:
        config_entry:
          integration: kiosk_satellite_manager
rename_device:
  name: Rename device
  description: >-
    Rename a managed device's Kiosk Satellite identity, Android system name
    (when a supported method exists), and KSM entry/DNS host from one
    display name, then reload its ESPHome entry so the ESPHome actions
    register under the new name. Returns a per-layer result -- a partial completion (e.g.
    host: pending) is not a failure.
  fields:
    config_entry_id:
      name: Device
      description: The Kiosk Satellite Manager config entry to rename.
      required: true
      selector:
        config_entry:
          integration: kiosk_satellite_manager
    name:
      name: Name
      description: The new display name, e.g. "Great Room Portal".
      required: true
      example: "Great Room Portal"
      selector:
        text:
