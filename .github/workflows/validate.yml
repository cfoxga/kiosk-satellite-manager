# Runs only on GitHub. KSM is developed on OneDev and pushed to GitHub for each HACS release.
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The icon ships in custom_components/kiosk_satellite_manager/brand/ (HA 2026.3+
          # serves it locally); remove once hacs/action is confirmed to accept that.
          ignore: brands
